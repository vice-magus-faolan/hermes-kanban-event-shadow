name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  standalone-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      HERMES_AGENT_ROOT: ${{ github.workspace }}/.hermes-runtime-source
      TMPDIR: ${{ github.workspace }}/.test-scratch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Exact native Hermes test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: f42f579cf8bac4918ac9599bece71618afadd846
          path: .hermes-runtime-source
          persist-credentials: false
      - name: Prepare isolated test prerequisites
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Canonical verification (no live installation)
        run: |
          python3 -I scripts/verify.py
          python3 -I -O scripts/verify.py
